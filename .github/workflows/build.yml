name: Android CI & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH || true
          echo "$ANDROID_HOME/tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/tools/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
      - name: Install SDK packages
        timeout-minutes: 10
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
      - name: Prepare release signing config
        if: github.event_name == 'push'
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY_STORE_BASE64" ]; then
            echo "WARNING: Signing secrets not found. Building unsigned release." 
            echo "UNSIGNED=true" >> $GITHUB_ENV
          else
            echo "$SIGNING_KEY_STORE_BASE64" | base64 -d > signing.jks
            echo "UNSIGNED=false" >> $GITHUB_ENV
          fi
      - name: Build release APK
        if: github.event_name == 'push'
        run: |
          if [ "$UNSIGNED" = "true" ]; then
            ./gradlew assembleRelease --verbose
          else
            ./gradlew assembleRelease \
              -PSIGNING_KEY_STORE_PATH="$(pwd)/signing.jks" \
              -PSIGNING_KEY_ALIAS="$SIGNING_KEY_ALIAS" \
              -PSIGNING_STORE_PASSWORD="$SIGNING_STORE_PASSWORD" \
              -PSIGNING_KEY_PASSWORD="$SIGNING_KEY_PASSWORD"
          fi
      - name: Build debug APK
        if: github.event_name != 'push'
        run: ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanficfare-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.sha }}"
          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            --title "Build ${{ github.sha }}" \
            --notes "Automated APK build from commit \`${{ github.sha }}\` on ${{ github.ref_name }}." \
            --target "${{ github.sha }}" \
            --repo "${{ github.repository }}"
