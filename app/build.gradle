apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.example.fanficfare'
    compileSdk 35

    buildFeatures {
        dataBinding = false
    }

    signingConfigs {
        release {
            if (project.hasProperty('SIGNING_KEY_STORE_PATH') &&
                project.hasProperty('SIGNING_KEY_ALIAS') &&
                project.hasProperty('SIGNING_STORE_PASSWORD') &&
                project.hasProperty('SIGNING_KEY_PASSWORD')) {
                storeFile file(SIGNING_KEY_STORE_PATH)
                keyAlias SIGNING_KEY_ALIAS
                storePassword SIGNING_STORE_PASSWORD
                keyPassword SIGNING_KEY_PASSWORD
            }
        }
    }

    defaultConfig {
        applicationId "com.example.fanficfare"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "0.1.1"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"
        buildPython "/usr/bin/python3.12"
        pip {
            install "beautifulsoup4"
            install "chardet"
            install "html5lib"
            install "html2text"
            install "cloudscraper"
            install "requests"
            install "requests-file"
            install "urllib3"
            install "Brotli"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'

    def lifecycle_version = "2.8.0"
    def coroutines_version = "1.8.0"
    def room_version = "2.6.1"
    def work_version = "2.9.1"

    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.work:work-runtime-ktx:$work_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
}

repositories {
    google()
    maven { url = uri("https://repo1.maven.org/maven2/") }
    mavenCentral()
}
