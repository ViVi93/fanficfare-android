name: Android CI & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH || true
          echo "$ANDROID_HOME/tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/tools/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
      - name: Install SDK packages
        timeout-minutes: 10
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
      - name: Decode release keystore
        if: github.event_name == 'push'
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY_STORE_BASE64" ]; then
            echo "::warning::Signing secrets absent - the release build will be unsigned."
          else
            echo "$SIGNING_KEY_STORE_BASE64" | base64 -d > signing.jks
            echo "Decoded signing.jks ($(stat -c%s signing.jks) bytes)."
          fi
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Build release APK
        if: github.event_name == 'push'
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # app/build.gradle only attaches signingConfigs.release when all four
          # SIGNING_* properties are supplied; otherwise assembleRelease emits
          # app-release-unsigned.apk. Passing the properties is therefore what
          # selects the signed or unsigned path - no retry bookkeeping needed.
          if [ ! -f signing.jks ]; then
            echo "No keystore available - building an unsigned release APK."
            ./gradlew assembleRelease
            exit 0
          fi

          if ./gradlew assembleRelease \
               -PSIGNING_KEY_STORE_PATH="$(pwd)/signing.jks" \
               -PSIGNING_KEY_ALIAS="$SIGNING_KEY_ALIAS" \
               -PSIGNING_STORE_PASSWORD="$SIGNING_STORE_PASSWORD" \
               -PSIGNING_KEY_PASSWORD="$SIGNING_KEY_PASSWORD"; then
            echo "Signed release build succeeded."
          else
            echo "::warning::Signed release build failed - falling back to an unsigned release APK."
            ./gradlew assembleRelease
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aharana-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.sha }}"
          # Prefer signed release, then unsigned release, then debug. The debug
          # APK is last on purpose: it carries the '.debug' applicationId suffix
          # and so would not upgrade an existing install.
          APK_PATH=""
          for candidate in \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/debug/app-debug.apk; do
            if [ -f "$candidate" ]; then APK_PATH="$candidate"; break; fi
          done
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found to publish."
            exit 1
          fi
          echo "Publishing $APK_PATH"
          gh release create "$TAG" "$APK_PATH" \
            --title "Build ${{ github.sha }}" \
            --notes "Automated APK build from commit \`${{ github.sha }}\` on ${{ github.ref_name }}." \
            --target "${{ github.sha }}" \
            --repo "${{ github.repository }}"
