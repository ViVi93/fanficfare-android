buildscript {
    repositories {
        google()
        maven { url = uri("https://repo1.maven.org/maven2/") }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20'
    }
}

allprojects {
    repositories {
        google()
        maven { url = uri("https://repo1.maven.org/maven2/") }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
